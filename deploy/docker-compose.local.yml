{
  "name": "${FIRSTSUN_PROJECT_NAME:-firstsun}",
  "services": {
    "mysql": {
      "image": "mysql:8.0",
      "environment": {
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD:?Run start-local.bat to prepare local configuration}",
        "MYSQL_DATABASE": "${MYSQL_DATABASE:?Run start-local.bat to prepare local configuration}",
        "MYSQL_USER": "${MYSQL_USER:?Run start-local.bat to prepare local configuration}",
        "MYSQL_PASSWORD": "${MYSQL_PASSWORD:?Run start-local.bat to prepare local configuration}",
        "TZ": "Asia/Shanghai"
      },
      "command": [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ],
      "ports": [
        "127.0.0.1:${MYSQL_PORT:-23327}:3306"
      ],
      "volumes": [
        "mysql-data:/var/lib/mysql"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse \"SELECT 1\" >/dev/null 2>&1"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "30s"
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "redis": {
      "image": "redis:7-alpine",
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?Missing REDIS_PASSWORD}",
        "TZ": "Asia/Shanghai"
      },
      "command": [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
      ],
      "ports": [
        "127.0.0.1:${REDIS_PORT:-26397}:6379"
      ],
      "volumes": [
        "redis-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "30s"
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "qdrant": {
      "image": "qdrant/qdrant:v1.12.1",
      "environment": {
        "QDRANT__SERVICE__GRPC_PORT": "6334",
        "QDRANT__LOG_LEVEL": "INFO"
      },
      "ports": [
        "127.0.0.1:${QDRANT_HTTP_PORT:-26333}:6333",
        "127.0.0.1:${QDRANT_GRPC_PORT:-26334}:6334"
      ],
      "volumes": [
        "qdrant-data:/qdrant/storage"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30,
        "start_period": "10s"
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "embedding": {
      "image": "${COMPOSE_PROJECT_NAME:-firstsun}-embedding:local",
      "build": {
        "context": "./embedding",
        "dockerfile": "Dockerfile"
      },
      "environment": {
        "TZ": "Asia/Shanghai",
        "EMBEDDING_MODEL": "${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}",
        "EMBEDDING_SERVED_MODEL": "${EMBEDDING_SERVED_MODEL:-bge-small-zh-v1.5}",
        "EMBEDDING_PORT": "8000"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()\" || exit 1"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 40,
        "start_period": "20s"
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "backend": {
      "image": "${COMPOSE_PROJECT_NAME:-firstsun}-backend:local",
      "build": {
        "context": "../backend",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "mysql": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        },
        "qdrant": {
          "condition": "service_healthy"
        },
        "embedding": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "TZ": "Asia/Shanghai",
        "JAVA_OPTS": "-Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom",
        "ARGS": "--spring.profiles.active=local --yudao.security.mock-enable=false --firstsun.miniapp.mock-payment-enabled=${FIRSTSUN_MOCK_PAYMENT_ENABLED:-false} --firstsun.miniapp.pay-app-key=${FIRSTSUN_PAY_APP_KEY:-firstsun} --firstsun.miniapp.order-expiry-enabled=${FIRSTSUN_ORDER_EXPIRY_ENABLED:-true} --spring.datasource.druid.stat-view-servlet.enabled=false --spring.boot.admin.client.enabled=false --spring.quartz.auto-startup=false --yudao.captcha.enable=false --justauth.enabled=false --wx.miniapp.appid=${WX_MINIAPP_APPID:-} --wx.miniapp.secret=${WX_MINIAPP_SECRET:-} --wx.mp.app-id= --wx.mp.secret= --yudao.tencent-lbs-key= --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://mysql:3306/${FIRSTSUN_APP_DATABASE:-${MYSQL_DATABASE}}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true --spring.datasource.dynamic.datasource.master.username=${MYSQL_USER} --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://mysql:3306/${FIRSTSUN_APP_DATABASE:-${MYSQL_DATABASE}}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true --spring.datasource.dynamic.datasource.slave.username=${MYSQL_USER} --spring.data.redis.host=redis --spring.data.redis.port=6379 --spring.data.redis.database=${FIRSTSUN_REDIS_DATABASE:-0} --yudao.pay.order-notify-url=http://backend:48080/admin-api/pay/notify/order --yudao.pay.refund-notify-url=http://backend:48080/admin-api/pay/notify/refund --yudao.pay.transfer-notify-url=http://backend:48080/admin-api/pay/notify/transfer --logging.file.name=/local-logs/backend.log --yudao.pharmacy.member-email.enabled=${PHARMACY_MEMBER_EMAIL_ENABLED:-false} --spring.ai.vectorstore.qdrant.host=qdrant --spring.ai.vectorstore.qdrant.port=6334 --firstsun.ai.knowledge.corpus-path=/knowledge/corpus.json",
        "SPRING_CONFIG_IMPORT": "configtree:/run/secrets/",
        "PHARMACY_MEMBER_EMAIL_ENABLED": "${PHARMACY_MEMBER_EMAIL_ENABLED:-false}",
        "PHARMACY_MEMBER_EMAIL_FROM": "${PHARMACY_MEMBER_EMAIL_FROM:-}",
        "PHARMACY_MEMBER_EMAIL_TEST_RECIPIENT": "${PHARMACY_MEMBER_EMAIL_TEST_RECIPIENT:-}",
        "RESEND_API_KEY": "${RESEND_API_KEY:-}",
        "PHARMACY_AI_API_KEY": "${PHARMACY_AI_API_KEY:-}",
        "PHARMACY_AI_BASE_URL": "${PHARMACY_AI_BASE_URL:-}",
        "PHARMACY_AI_MODEL": "${PHARMACY_AI_MODEL:-}",
        "PHARMACY_DEV_SMS_CODE": "${PHARMACY_DEV_SMS_CODE:-}",
        "PHARMACY_WECHAT_TENANT_ID": "${PHARMACY_WECHAT_TENANT_ID:-}",
        "PHARMACY_WECHAT_APP_ID": "${PHARMACY_WECHAT_APP_ID:-}",
        "FIRSTSUN_EMBEDDING_URL": "${FIRSTSUN_EMBEDDING_URL:-http://embedding:8000}"
      },
      "secrets": [
        { "source": "mysql_master_password", "target": "spring.datasource.dynamic.datasource.master.password" },
        { "source": "mysql_slave_password", "target": "spring.datasource.dynamic.datasource.slave.password" },
        { "source": "redis_password", "target": "spring.data.redis.password" }
      ],
      "ports": [
        "127.0.0.1:${BACKEND_PORT:-28080}:48080"
      ],
      "volumes": [
        "backend-logs:/local-logs",
        "./knowledge:/knowledge:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:48080/actuator/health >/dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "30s"
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "admin-ui": {
      "image": "${COMPOSE_PROJECT_NAME:-firstsun}-admin-ui:local",
      "build": {
        "context": "../admin-ui",
        "dockerfile": "Dockerfile",
        "args": {
          "VITE_BASE_URL": "http://127.0.0.1:${BACKEND_PORT:-28080}"
        }
      },
      "depends_on": {
        "backend": {
          "condition": "service_healthy"
        }
      },
      "ports": [
        "127.0.0.1:${ADMIN_PORT:-28081}:80"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "30s"
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "customer-web": {
      "image": "${COMPOSE_PROJECT_NAME:-firstsun}-customer-web:local",
      "build": {
        "context": "../customer-web",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "backend": {
          "condition": "service_healthy"
        }
      },
      "ports": [
        "127.0.0.1:${CUSTOMER_PORT:-4193}:80"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      },
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "secrets": {
    "mysql_master_password": { "environment": "MYSQL_PASSWORD" },
    "mysql_slave_password": { "environment": "MYSQL_PASSWORD" },
    "redis_password": { "environment": "REDIS_PASSWORD" }
  },
  "volumes": {
    "mysql-data": {
      "external": true,
      "name": "${FIRSTSUN_MYSQL_VOLUME:-${FIRSTSUN_PROJECT_NAME:-firstsun-thesis-local}_mysql-data}"
    },
    "redis-data": {
      "external": true,
      "name": "${FIRSTSUN_REDIS_VOLUME:-${FIRSTSUN_PROJECT_NAME:-firstsun-thesis-local}_redis-data}"
    },
    "backend-logs": {
      "external": true,
      "name": "${FIRSTSUN_LOGS_VOLUME:-${FIRSTSUN_PROJECT_NAME:-firstsun-thesis-local}_backend-logs}"
    },
    "qdrant-data": {
      "name": "${COMPOSE_PROJECT_NAME:-firstsun}_qdrant_data"
    }
  },
  "networks": {
    "default": {
      "name": "${COMPOSE_PROJECT_NAME:-firstsun}-network"
    }
  }
}
